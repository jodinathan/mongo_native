[package]
name = "mongo_native_ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mongodb = { version = "=3.10.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
bson = "=2.15.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = "0.3"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = true
